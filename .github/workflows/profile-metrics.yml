name: Update profile contribution calendars

on:
  schedule:
    # Todos los días aproximadamente a las 06:15 de Ecuador.
    - cron: "15 11 * * *"

  # Permite ejecutarlo manualmente desde Actions.
  workflow_dispatch:

  # Se ejecuta cuando se modifica este archivo.
  push:
    branches:
      - main
    paths:
      - ".github/workflows/profile-metrics.yml"

permissions:
  contents: write

jobs:
  generate-calendars:
    name: Generate contribution calendars
    runs-on: ubuntu-latest

    env:
      METRICS_DARK_CSS: |
        :root,
        body {
          background-color: #0d1117 !important;
          color: #c9d1d9 !important;
        }

        h1,
        h2,
        h3 {
          color: #58a6ff !important;
        }

        .field svg {
          fill: #8b949e !important;
        }

        h1 svg,
        h2 svg,
        h3 svg {
          fill: #58a6ff !important;
        }

        svg[viewBox^="0,0 480,"] {
          display: block !important;
          margin-left: auto !important;
          margin-right: auto !important;
        }

        [fill="#ebedf0" i] {
          fill: #161b22 !important;
        }

        [fill="#9be9a8" i] {
          fill: #0e4429 !important;
        }

        [fill="#40c463" i] {
          fill: #006d32 !important;
        }

        [fill="#30a14e" i] {
          fill: #26a641 !important;
        }

        [fill="#216e39" i] {
          fill: #39d353 !important;
        }

      METRICS_LIGHT_CSS: |
        :root,
        body {
          background-color: #ffffff !important;
          color: #24292f !important;
        }

        h1,
        h2,
        h3 {
          color: #0969da !important;
        }

        .field svg {
          fill: #57606a !important;
        }

        h1 svg,
        h2 svg,
        h3 svg {
          fill: #0969da !important;
        }

        svg[viewBox^="0,0 480,"] {
          display: block !important;
          margin-left: auto !important;
          margin-right: auto !important;
        }

    steps:
      # ---------------------------------------------------------
      # CUENTA PERSONAL: CALENDARIO ISOMÉTRICO (OSCURO)
      # ---------------------------------------------------------

      - name: Generate personal isometric calendar (dark)
        uses: lowlighter/metrics@v3.34
        with:
          token: ${{ secrets.METRICS_TOKEN_PERSONAL }}
          user: GuerreroWelinton

          filename: assets/metrics/personal-isocalendar-dark.svg
          output_action: commit
          committer_branch: main
          committer_message: "chore(metrics): update personal isocalendar (dark) [skip ci]"

          template: classic
          base: ""
          config_timezone: America/Guayaquil
          config_display: large
          extras_css: ${{ env.METRICS_DARK_CSS }}

          plugin_isocalendar: yes
          plugin_isocalendar_duration: half-year

      # ---------------------------------------------------------
      # CUENTA PERSONAL: CALENDARIO ISOMÉTRICO (CLARO)
      # ---------------------------------------------------------

      - name: Generate personal isometric calendar (light)
        uses: lowlighter/metrics@v3.34
        with:
          token: ${{ secrets.METRICS_TOKEN_PERSONAL }}
          user: GuerreroWelinton

          filename: assets/metrics/personal-isocalendar-light.svg
          output_action: commit
          committer_branch: main
          committer_message: "chore(metrics): update personal isocalendar (light) [skip ci]"

          template: classic
          base: ""
          config_timezone: America/Guayaquil
          config_display: large
          extras_css: ${{ env.METRICS_LIGHT_CSS }}

          plugin_isocalendar: yes
          plugin_isocalendar_duration: half-year

      # ---------------------------------------------------------
      # CUENTA PROFESIONAL: CALENDARIO ISOMÉTRICO (OSCURO)
      # ---------------------------------------------------------

      - name: Generate professional isometric calendar (dark)
        uses: lowlighter/metrics@v3.34
        with:
          token: ${{ secrets.METRICS_TOKEN_WORK }}
          user: WguerreroZG

          filename: assets/metrics/work-isocalendar-dark.svg
          output_action: commit
          committer_branch: main
          committer_message: "chore(metrics): update professional isocalendar (dark) [skip ci]"

          template: classic
          base: ""
          config_timezone: America/Guayaquil
          config_display: large
          extras_css: ${{ env.METRICS_DARK_CSS }}

          plugin_isocalendar: yes
          plugin_isocalendar_duration: half-year

      # ---------------------------------------------------------
      # CUENTA PROFESIONAL: CALENDARIO ISOMÉTRICO (CLARO)
      # ---------------------------------------------------------

      - name: Generate professional isometric calendar (light)
        uses: lowlighter/metrics@v3.34
        with:
          token: ${{ secrets.METRICS_TOKEN_WORK }}
          user: WguerreroZG

          filename: assets/metrics/work-isocalendar-light.svg
          output_action: commit
          committer_branch: main
          committer_message: "chore(metrics): update professional isocalendar (light) [skip ci]"

          template: classic
          base: ""
          config_timezone: America/Guayaquil
          config_display: large
          extras_css: ${{ env.METRICS_LIGHT_CSS }}

          plugin_isocalendar: yes
          plugin_isocalendar_duration: half-year
